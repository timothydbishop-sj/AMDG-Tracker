<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AMDG">
<meta name="theme-color" content="#0f0f0f">
<title>AMDG Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#141414;--bg3:#1a1a1a;
  --border:#222;--border2:#2a2a2a;
  --text:#e8e0d0;--text2:#c8c0b0;--text3:#a09080;
  --muted:#555;--faint:#333;
  --red:#c0392b;--red-acc:#e74c3c;--red-bg:#3d0000;
  --blue:#2980b9;--blue-acc:#5dade2;--blue-bg:#0a1a2e;
  --green:#2d6a4f;--green-acc:#52b788;
  --gold:#f39c12;--gold-bg:#2a1800;--gold-border:#b7770d;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'EB Garamond',serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{padding:env(safe-area-inset-top,1rem) env(safe-area-inset-right,0) env(safe-area-inset-bottom,1rem) env(safe-area-inset-left,0)}
.app{max-width:560px;margin:0 auto;padding:1.5rem 1rem 3rem}

.header{text-align:center;margin-bottom:1.75rem}
.cap{font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.header h1{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:600;letter-spacing:.06em;color:var(--text);margin-bottom:.25rem}
.header p{font-style:italic;color:var(--muted);font-size:.85rem}

.score-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;display:flex;align-items:center;gap:1.25rem;margin-bottom:1.25rem}
.ring-wrap{position:relative;width:68px;height:68px;flex-shrink:0}
.ring-wrap svg{position:absolute;inset:0}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring-pct{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:700}
.score-info .si-label{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;color:var(--muted);margin-bottom:.2rem}
.score-info .si-count{font-size:1rem;color:var(--text2)}
.score-info .si-through{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:.15rem}

.nav{display:flex;margin-bottom:1.5rem;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.nav-btn{flex:1;font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.1em;padding:.6rem;background:transparent;border:none;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-btn.active{background:var(--bg2);color:var(--text)}
.nav-btn+.nav-btn{border-left:1px solid var(--border)}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.6rem 1rem .4rem;margin-bottom:1rem}
.card-header{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;padding:.4rem 0 .6rem;border-bottom:1px solid var(--border);margin-bottom:.25rem}

.day-hdr{display:grid;grid-template-columns:1fr repeat(7,36px);gap:3px;align-items:center;padding:.3rem 0 .1rem}
.day-hdr span{text-align:center;font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.04em;color:var(--faint)}
.day-hdr span.tod{color:var(--text)}

.goal-row{display:grid;grid-template-columns:1fr repeat(7,36px);gap:3px;align-items:center;padding:.55rem 0;border-top:1px solid #191919}
.gi-name{font-size:.9rem;color:var(--text2);line-height:1.2}
.gi-desc{font-size:.72rem;color:var(--muted);font-style:italic}

.dc{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.75rem;color:var(--faint);font-family:'EB Garamond',serif;transition:transform .1s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dc:active{transform:scale(.88)}
.dc.fut{opacity:.2;pointer-events:none}
.dc.tod-cell{border-width:2px}
.dc.av-clean{border-color:var(--green);color:var(--green-acc)}
.dc.av-slip{background:var(--red-bg);border-color:var(--red);color:var(--red-acc)}
.dc.pu-empty{border-color:var(--border2);color:var(--faint)}
.dc.pu-done{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-acc)}
.dc.nt-marked{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold)}
.dc.nt-empty{border-color:var(--border2);color:var(--faint)}

.ref-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1.25rem}
.ref-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.ref-text{font-size:.92rem;color:var(--text3);font-style:italic;line-height:1.65;min-height:1.8rem}
.ref-text.empty{color:var(--faint)}
textarea{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:'EB Garamond',serif;font-size:.95rem;padding:.75rem;border-radius:6px;resize:vertical;outline:none;line-height:1.6}
textarea:focus{border-color:var(--muted)}
.btn-row{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem}

.btn{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.1em;padding:.45rem 1.1rem;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;border-radius:3px;-webkit-tap-highlight-color:transparent}
.btn:active{border-color:var(--muted);color:var(--text)}
.btn.primary{border-color:var(--blue);color:var(--blue-acc)}
.btn.primary:active{background:var(--blue-bg)}

.hist-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1.25rem}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:.8rem;color:var(--text3);font-style:italic}
.hist-score{font-family:'Cinzel',serif;font-size:.85rem}

.footer{text-align:center;color:var(--faint);font-size:.72rem;font-style:italic;padding-top:.5rem}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var DAYS_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DAYS_F = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

var GOALS = [
  {id:'nicotine', name:'Nicotine-free',   desc:'No vaping or pouches',      type:'avoid'},
  {id:'porn',     name:'Chaste internet', desc:'No porn or lustful content', type:'avoid'},
  {id:'alcohol',  name:'Alcohol',         desc:'Tap on days you drink',      type:'note'},
  {id:'exercise', name:'30 min activity', desc:'Any physical movement',      type:'pursue'},
  {id:'prayer',   name:'30 min prayer',   desc:'Dedicated prayer time',      type:'pursue'},
  {id:'examen1',  name:'Morning Examen',  desc:'First daily Examen',         type:'pursue'},
  {id:'examen2',  name:'Evening Examen',  desc:'Second daily Examen',        type:'pursue'}
];

var KEY = 'amdg-v2';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; }
}
function save(d) {
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
}

function weekStart(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() - d.getDay() + offset * 7);
  d.setHours(0,0,0,0);
  return d.toISOString().split('T')[0];
}

function calcScore(wk, upTo) {
  var score = 0, possible = 0;
  for (var gi = 0; gi < GOALS.length; gi++) {
    var g = GOALS[gi];
    if (g.type === 'note') continue;
    for (var i = 0; i <= upTo; i++) {
      possible++;
      var checked = !!wk[g.id + '_' + i];
      if (g.type === 'pursue' && checked) score++;
      if (g.type === 'avoid' && !checked) score++;
    }
  }
  return {score: score, possible: possible};
}

var appData = load();
var currentTab = 'today';
var editingNote = false;
var noteBuffer = '';
var todayIdx = new Date().getDay();
var ws = weekStart(0);

function wk() { return appData['wk_' + ws] || {}; }
function nk() { return 'note_' + ws; }

function toggle(goalId, day) {
  var week = wk();
  var k = goalId + '_' + day;
  week[k] = !week[k];
  appData['wk_' + ws] = week;
  save(appData);
  render();
}

function render() {
  document.getElementById('app').innerHTML = html();
  bind();
}

function html() {
  var d = new Date(ws + 'T12:00:00');
  var wkStr = d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  return (
    '<div class="header">' +
      '<div class="cap">Week of ' + wkStr + '</div>' +
      '<h1>Ad Maiorem Dei Gloriam</h1>' +
      '<p>daily fidelity tracker</p>' +
    '</div>' +
    navHtml() +
    (currentTab === 'today' ? todayHtml() : historyHtml()) +
    '<div class="footer">In omnibus amare et servire</div>'
  );
}

function navHtml() {
  return (
    '<div class="nav">' +
      '<button class="nav-btn' + (currentTab==='today'?' active':'') + '" data-tab="today">This Week</button>' +
      '<button class="nav-btn' + (currentTab==='history'?' active':'') + '" data-tab="history">History</button>' +
    '</div>'
  );
}

function todayHtml() {
  var week = wk();
  var res = calcScore(week, todayIdx);
  var pct = res.possible > 0 ? Math.round(res.score / res.possible * 100) : 0;
  var ringColor = pct >= 80 ? '#52b788' : pct >= 50 ? '#f39c12' : '#c0392b';
  var C = 2 * Math.PI * 28;
  var dash = (pct / 100) * C;

  return (
    scoreCardHtml(pct, ringColor, C, dash, res) +
    sectionHtml('avoid', '&#10005;&nbsp;&nbsp;Resist &mdash; tap if you slipped', week) +
    noteSecHtml(week) +
    sectionHtml('pursue', '&#10022;&nbsp;&nbsp;Pursue &mdash; tap when done', week) +
    reflectionHtml()
  );
}

function scoreCardHtml(pct, ringColor, C, dash, res) {
  var through = todayIdx === 6 ? 'Week complete' : 'Through ' + DAYS_F[todayIdx];
  return (
    '<div class="score-card">' +
      '<div class="ring-wrap">' +
        '<svg width="68" height="68" viewBox="0 0 68 68">' +
          '<circle cx="34" cy="34" r="28" fill="none" stroke="#222" stroke-width="4"/>' +
          '<circle cx="34" cy="34" r="28" fill="none" stroke="' + ringColor + '" stroke-width="4"' +
            ' stroke-dasharray="' + dash + ' ' + C + '"' +
            ' stroke-linecap="round" transform="rotate(-90 34 34)"/>' +
        '</svg>' +
        '<div class="ring-center"><span class="ring-pct" style="color:' + ringColor + '">' + pct + '%</span></div>' +
      '</div>' +
      '<div class="score-info">' +
        '<div class="si-label">This Week</div>' +
        '<div class="si-count">' + res.score + ' of ' + res.possible + ' marks</div>' +
        '<div class="si-through">' + through + '</div>' +
      '</div>' +
    '</div>'
  );
}

function dayHdrHtml() {
  var out = '<div class="day-hdr"><span></span>';
  for (var i = 0; i < 7; i++) {
    out += '<span class="' + (i === todayIdx ? 'tod' : '') + '">' + DAYS_S[i] + '</span>';
  }
  return out + '</div>';
}

function sectionHtml(type, header, week) {
  var goals = GOALS.filter(function(g){ return g.type === type; });
  var rows = '';
  for (var i = 0; i < goals.length; i++) {
    rows += goalRowHtml(goals[i], week);
  }
  return (
    '<div class="card">' +
      '<div class="card-header">' + header + '</div>' +
      dayHdrHtml() +
      rows +
    '</div>'
  );
}

function noteSecHtml(week) {
  var g = null;
  for (var i = 0; i < GOALS.length; i++) {
    if (GOALS[i].type === 'note') { g = GOALS[i]; break; }
  }
  if (!g) return '';
  var drinkDays = 0;
  for (var d = 0; d < 7; d++) {
    if (week[g.id + '_' + d]) drinkDays++;
  }
  var countStr = drinkDays > 0 ? '&nbsp;&nbsp;<span style="color:var(--gold);font-size:.7rem;">' + drinkDays + '&times; this week</span>' : '';
  return (
    '<div class="card">' +
      '<div class="card-header">&#9671;&nbsp;&nbsp;Awareness &mdash; tap days you drank' + countStr + '</div>' +
      dayHdrHtml() +
      goalRowHtml(g, week) +
    '</div>'
  );
}

function goalRowHtml(g, week) {
  var cells = '';
  for (var i = 0; i < 7; i++) {
    var checked = !!week[g.id + '_' + i];
    var isFut = i > todayIdx;
    var isTod = i === todayIdx;
    var cls = 'dc';
    var sym = '&middot;';
    if (isFut) {
      cls += ' fut';
    } else if (g.type === 'avoid') {
      cls += checked ? ' av-slip' : ' av-clean';
      sym = checked ? '&#10005;' : '&middot;';
    } else if (g.type === 'pursue') {
      cls += checked ? ' pu-done' : ' pu-empty';
      sym = checked ? '&#10022;' : '&middot;';
    } else {
      cls += checked ? ' nt-marked' : ' nt-empty';
      sym = checked ? '&#10005;' : '&middot;';
    }
    if (isTod && !isFut) cls += ' tod-cell';
    cells += '<button class="' + cls + '" data-goal="' + g.id + '" data-day="' + i + '">' + sym + '</button>';
  }
  return (
    '<div class="goal-row">' +
      '<div><div class="gi-name">' + g.name + '</div><div class="gi-desc">' + g.desc + '</div></div>' +
      cells +
    '</div>'
  );
}

function reflectionHtml() {
  var saved = appData[nk()] || '';
  if (editingNote) {
    return (
      '<div class="ref-card">' +
        '<div class="cap" style="margin-bottom:.5rem;">&#9998;&nbsp;&nbsp;Weekly reflection</div>' +
        '<textarea id="note-ta" rows="4" placeholder="What moved you this week? Consolation or desolation?">' + noteBuffer + '</textarea>' +
        '<div class="btn-row">' +
          '<button class="btn" id="note-cancel">Cancel</button>' +
          '<button class="btn primary" id="note-save">Save</button>' +
        '</div>' +
      '</div>'
    );
  }
  return (
    '<div class="ref-card">' +
      '<div class="ref-head">' +
        '<div class="cap" style="font-size:.6rem;">&#9998;&nbsp;&nbsp;Weekly reflection</div>' +
        '<button class="btn" id="note-edit">' + (saved ? 'Edit' : 'Add note') + '</button>' +
      '</div>' +
      '<div class="ref-text' + (saved ? '' : ' empty') + '">' + (saved || 'No reflection yet this week.') + '</div>' +
    '</div>'
  );
}

function historyHtml() {
  var weeks = [];
  var keys = Object.keys(appData);
  for (var i = 0; i < keys.length; i++) {
    if (keys[i].indexOf('wk_') === 0) weeks.push(keys[i].replace('wk_', ''));
  }
  weeks.sort(function(a,b){ return b > a ? 1 : -1; });
  if (weeks.length === 0) {
    return '<div class="hist-card"><p style="color:var(--muted);font-style:italic;font-size:.9rem;padding:.5rem 0">No history yet &mdash; check back after your first week.</p></div>';
  }
  var rows = '';
  for (var wi = 0; wi < weeks.length; wi++) {
    var w = weeks[wi];
    var weekObj = appData['wk_' + w] || {};
    var isCurrent = w === ws;
    var upTo = isCurrent ? todayIdx : 6;
    var res = calcScore(weekObj, upTo);
    var pct = res.possible > 0 ? Math.round(res.score / res.possible * 100) : 0;
    var color = pct >= 80 ? 'var(--green-acc)' : pct >= 50 ? 'var(--gold)' : 'var(--red-acc)';
    var wd = new Date(w + 'T12:00:00');
    var lbl = wd.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    rows += (
      '<div class="hist-row">' +
        '<div>' +
          '<div style="font-size:.85rem;color:var(--text2)">Week of ' + lbl + '</div>' +
          '<div class="hist-date">' + (isCurrent ? 'current week' : res.score + ' / ' + res.possible + ' marks') + '</div>' +
        '</div>' +
        '<div class="hist-score" style="color:' + color + '">' + pct + '%</div>' +
      '</div>'
    );
  }
  return '<div class="hist-card">' + rows + '</div>';
}

function bind() {
  var navBtns = document.querySelectorAll('.nav-btn');
  for (var i = 0; i < navBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        currentTab = btn.getAttribute('data-tab');
        render();
      });
    })(navBtns[i]);
  }

  var cells = document.querySelectorAll('.dc');
  for (var j = 0; j < cells.length; j++) {
    (function(cell) {
      cell.addEventListener('click', function() {
        toggle(cell.getAttribute('data-goal'), parseInt(cell.getAttribute('data-day')));
      });
    })(cells[j]);
  }

  var editBtn = document.getElementById('note-edit');
  if (editBtn) {
    editBtn.addEventListener('click', function() {
      noteBuffer = appData[nk()] || '';
      editingNote = true;
      render();
      var ta = document.getElementById('note-ta');
      if (ta) ta.focus();
    });
  }

  var ta = document.getElementById('note-ta');
  if (ta) {
    ta.addEventListener('input', function() { noteBuffer = ta.value; });
  }

  var cancelBtn = document.getElementById('note-cancel');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', function() {
      editingNote = false;
      render();
    });
  }

  var saveBtn = document.getElementById('note-save');
  if (saveBtn) {
    saveBtn.addEventListener('click', function() {
      var ta2 = document.getElementById('note-ta');
      appData[nk()] = ta2 ? ta2.value : noteBuffer;
      save(appData);
      editingNote = false;
      render();
    });
  }
}

render();
</script>
</body>
</html>
